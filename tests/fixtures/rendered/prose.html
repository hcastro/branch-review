<p>Most docs in a repo wrap at eighty columns, so a paragraph
spans several lines in the file. GitHub keeps those soft
breaks soft: the paragraph reflows, with no line breaks.</p>
<p>A trailing double space<br>
is a hard break, and so is a backslash<br>
at the end of a line.</p>
